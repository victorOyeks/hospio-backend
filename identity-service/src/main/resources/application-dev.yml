spring:
  jpa:
    show-sql: false
  liquibase:
    contexts: dev

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

hospio:
  seed:
    enabled: true
  otp:
    # Every one-time code is 159753 on dev (FixedOtp; never on production).
    fixed-code: ${OTP_FIXED_CODE:159753}
