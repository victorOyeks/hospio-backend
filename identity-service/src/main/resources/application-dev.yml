spring:
  jpa:
    show-sql: false
  liquibase:
    contexts: dev

management:
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: true

hospio:
  seed:
    enabled: true
  otp:
    # 159753 is also accepted as a backup one-time code on dev (FixedOtp; never sent, never on production).
    fixed-code: ${OTP_FIXED_CODE:159753}
