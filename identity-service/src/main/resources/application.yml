server:
  port: 9201
  forward-headers-strategy: framework
  # Fewer threads than Tomcat's 200: more would only queue on the connection pool.
  tomcat:
    threads:
      max: 50
    accept-count: 50
  servlet:
    context-path: /identity

spring:
  task:
    scheduling:
      # One slow job no longer holds up the others (each job still runs on one instance at a time).
      pool:
        size: 3
  config:
    import: optional:file:.env[.properties]
  application:
    name: identity-service
  servlet:
    # Profile photos (docs/profile.md): 2 MB is checked in the service; the limit here only keeps bigger bodies out.
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospio}?currentSchema=identity
    username: ${DB_USERNAME:hospio}
    password: ${DB_PASSWORD:hospio}
    hikari:
      # Liquibase writes its changelog table into this schema before the first changeset runs, so the
      # schema has to exist before Liquibase gets a connection. Idempotent, runs once per pooled connection.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS identity
      # Budget: every service's pool together stays under ~80 of Postgres' 100 connections (another product uses ~10).
      maximum-pool-size: 6
      minimum-idle: 2
      # Fail a request after 3s waiting for a connection instead of 30s; log a connection held over 20s.
      connection-timeout: 3000
      leak-detection-threshold: 20000
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: identity
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment-change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

hospio:
  deliveries:
    echo: ${DELIVERIES_ECHO:false}
  apps:
    # Where invite links point: platform staff and marketers open the admin portal, everyone else the hotel app.
    hotel-url: ${HOTEL_APP_URL:https://web-staging.hospio360.com}
    admin-url: ${ADMIN_APP_URL:https://admin-staging.hospio360.com}
  logging:
    # Log request bodies and error responses (secrets masked). On for dev/staging via HOSPIO_LOG_BODIES.
    bodies: ${HOSPIO_LOG_BODIES:false}
  seed:
    # Creates the test accounts / example hotel on start-up when missing (env SEED_DEMO_DATA).
    enabled: ${SEED_DEMO_DATA:false}
  auth:
    refresh-days: 30
    temporary-password-hours: 168
    pin-max-attempts: 5
    pin-lock-minutes: 15
    # Invite links (/accept-invite?token=) stay valid this long.
    invite-days: 7
    # Phone confirmation codes stay valid this long; the code is logged, no SMS goes out yet.
    phone-code-minutes: 10
    # When set (staging: 123456) this code is always accepted as a phone confirmation code.
    otp-dev-code: ${OTP_DEV_CODE:}
    # A support-access token ("view as owner") never lives longer than this, whatever the grant says.
    support-token-max-minutes: 60
    # 2-step secrets are AES-GCM encrypted with this key (env TWO_STEP_KEY); derived from JWT_SECRET when unset.
    two-step-key: ${TWO_STEP_KEY:}
    two-step:
      # Roles that will have to use 2-step (e.g. OWNER,MANAGER). Reported on GET /users/me/two-step, not enforced yet.
      required-roles: ${TWO_STEP_REQUIRED_ROLES:}
  storage:
    # Profile photos, as maintenance work-order photos (STORAGE_TYPE / STORAGE_DIR).
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_DIR:./storage}

services:
  tenant:
    url: ${TENANT_SERVICE_URL:http://localhost:9202/tenant}
  internal:
    api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
