server:
  port: 9201
  forward-headers-strategy: framework
  servlet:
    context-path: /identity

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospio}?currentSchema=identity
    username: ${DB_USERNAME:hospio}
    password: ${DB_PASSWORD:hospio}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: identity
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment-change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

hospio:
  auth:
    refresh-days: 30
    temporary-password-hours: 72
    pin-max-attempts: 5
    pin-lock-minutes: 15

services:
  internal:
    api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
