server:
  port: 9213
  forward-headers-strategy: framework
  # Fewer threads than Tomcat's 200: more would only queue on the connection pool.
  tomcat:
    threads:
      max: 50
    accept-count: 50
  servlet:
    context-path: /messaging

spring:
  task:
    scheduling:
      # One slow job no longer holds up the others (each job still runs on one instance at a time).
      pool:
        size: 3
  config:
    import: optional:file:.env[.properties]
  application:
    name: messaging-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospio}?currentSchema=messaging
    username: ${DB_USERNAME:hospio}
    password: ${DB_PASSWORD:hospio}
    hikari:
      # Liquibase writes its changelog table into this schema before the first changeset runs, so the
      # schema has to exist before Liquibase gets a connection. Idempotent, runs once per pooled connection.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS messaging
      # Budget: every service's pool together stays under ~80 of Postgres' 100 connections (another product uses ~10).
      maximum-pool-size: 6
      minimum-idle: 2
      # Fail a request after 3s waiting for a connection instead of 30s; log a connection held over 20s.
      connection-timeout: 3000
      leak-detection-threshold: 20000
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: messaging
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: messaging
  # Brevo SMTP relay (docs/email.md). Values only from the environment; never in a repo file or a log.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.transport.protocol: smtp
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: hospio-messaging-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment-change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

hospio:
  deliveries:
    echo: ${DELIVERIES_ECHO:false}
  # Guest messages as a paid service (docs/guest-message-billing.md): Paystack for paying invoices.
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
  apps:
    hotel-url: ${HOTEL_APP_URL:https://web-staging.hospio360.com}
  # SMS and WhatsApp through Infobip (docs/sms-whatsapp.md). Off unless switched on; the key comes from the environment.
  sms:
    enabled: ${SMS_ENABLED:false}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    language: ${WHATSAPP_LANGUAGE:en}
  infobip:
    base-url: ${INFOBIP_BASE_URL:}
    api-key: ${INFOBIP_API_KEY:}
    # The approved alphanumeric sender (e.g. Hospio360); empty uses Infobip's default until it is approved.
    sms-sender: ${INFOBIP_SMS_SENDER:}
    whatsapp-sender: ${INFOBIP_WHATSAPP_SENDER:}
    # Delivery reports: Infobip posts each message's outcome to notify-url?key=webhook-key (both empty = no reports).
    notify-url: ${INFOBIP_NOTIFY_URL:}
    webhook-key: ${INFOBIP_WEBHOOK_KEY:}
  texts:
    # Comma-separated numbers: when set, only these receive SMS/WhatsApp (staging), everyone else is held back.
    allow-only: ${TEXTS_ALLOW_ONLY:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@hospio360.com}
    from-name-default: ${MAIL_FROM_NAME_DEFAULT:Hospio360}
    # Brevo's API (docs/email.md): when set, email goes through the API with this key instead of SMTP.
    brevo-api-key: ${BREVO_API_KEY:}
    # Wait before the one retry of a transient failure.
    retry-delay-ms: ${MAIL_RETRY_DELAY_MS:5000}
    # A delivery event older than this is not sent (a replayed topic must never re-send old passwords and links).
    max-event-age-minutes: ${MAIL_MAX_EVENT_AGE_MINUTES:30}
  logging:
    # Log request bodies and error responses (secrets masked). On for dev/staging via HOSPIO_LOG_BODIES.
    bodies: ${HOSPIO_LOG_BODIES:false}
  worker:
    enabled: ${WORKER_ENABLED:true}
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_DIR:./storage}
  pos:
    provider: ${POS_PROVIDER:logging}
  channels:
    provider: ${CHANNELS_PROVIDER:logging}
  approvals:
    manager-spend-limit: ${MANAGER_SPEND_LIMIT:500000}
    manager-discount-limit: ${MANAGER_DISCOUNT_LIMIT:50000}
    org-credit-owner-limit: ${ORG_CREDIT_OWNER_LIMIT:1000000}

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9201/identity}
  tenant:
    url: ${TENANT_SERVICE_URL:http://localhost:9202/tenant}
  hotelconfig:
    url: ${HOTEL_CONFIG_SERVICE_URL:http://localhost:9203/hotel-config}
  property:
    url: ${PROPERTY_SERVICE_URL:http://localhost:9204/property}
  reservation:
    url: ${RESERVATION_SERVICE_URL:http://localhost:9205/reservation}
  folio:
    url: ${FOLIO_SERVICE_URL:http://localhost:9206/folio}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:9207/payment}
  fnb:
    url: ${FNB_SERVICE_URL:http://localhost:9208/fnb}
  housekeeping:
    url: ${HOUSEKEEPING_SERVICE_URL:http://localhost:9209/housekeeping}
  maintenance:
    url: ${MAINTENANCE_SERVICE_URL:http://localhost:9210/maintenance}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:9211/inventory}
  finance:
    url: ${FINANCE_SERVICE_URL:http://localhost:9212/finance}
  messaging:
    url: ${MESSAGING_SERVICE_URL:http://localhost:9213/messaging}
  platform:
    url: ${PLATFORM_SERVICE_URL:http://localhost:9214/platform}
  internal:
    api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
