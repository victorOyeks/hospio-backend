name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy: 'all' or a comma-separated list (e.g. identity-service,api-gateway)"
        required: false
        default: all

# Same shape as deploy-staging.yml (detect → build matrix → deploy, [deploy-all] in the commit message redeploys everything).
# Flow: push to staging (deploys staging), then a pull request staging → production; merging it deploys here.
# Everything server-specific lives in the GitHub environment "production" (secrets PROD_VPS_HOST, PROD_VPS_USER, PROD_VPS_SSH_KEY);
# the names differ from staging's VPS_* on purpose, so a missing production secret can never fall back to the staging box.

# One deploy at a time on the box; a new run waits for the running one instead of racing it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Fails fast, before anything is built or copied, when the production environment's secrets are not set yet.
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check production secrets
        env:
          HOST: ${{ secrets.PROD_VPS_HOST }}
          USER_NAME: ${{ secrets.PROD_VPS_USER }}
          KEY: ${{ secrets.PROD_VPS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing PROD_VPS_HOST"
          [ -n "$USER_NAME" ] || missing="$missing PROD_VPS_USER"
          [ -n "$KEY" ] || missing="$missing PROD_VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Production secrets missing in the GitHub environment 'production':$missing. Nothing was built or deployed. Set them (docs/deployment-production.md), then run this workflow by hand with services=all."
            exit 1
          fi
          echo "Production secrets present."

  detect-changes:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A manual run, the very first push to the branch (no "before" commit), or a commit whose message
      # contains [deploy-all] deploys everything.
      - id: all
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.before == '0000000000000000000000000000000000000000' || contains(github.event.head_commit.message, '[deploy-all]') }}
        env:
          REQUESTED: ${{ github.event.inputs.services }}
        run: |
          all='["api-gateway","identity-service","tenant-service","hotel-config-service","property-service","reservation-service","folio-service","payment-service","fnb-service","housekeeping-service","maintenance-service","inventory-service","finance-service","messaging-service","platform-service"]'
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            echo "services=$all" >> "$GITHUB_OUTPUT"
          else
            echo "services=$(echo "$REQUESTED" | tr -d ' ' | awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i}; printf "]"}')" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        if: ${{ steps.all.outcome == 'skipped' }}
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api-gateway:
              - 'api-gateway/**'

            identity-service:
              - 'identity-service/**'
              - 'common/**'

            tenant-service:
              - 'tenant-service/**'
              - 'common/**'

            hotel-config-service:
              - 'hotel-config-service/**'
              - 'common/**'

            property-service:
              - 'property-service/**'
              - 'common/**'

            reservation-service:
              - 'reservation-service/**'
              - 'common/**'

            folio-service:
              - 'folio-service/**'
              - 'common/**'

            payment-service:
              - 'payment-service/**'
              - 'common/**'

            fnb-service:
              - 'fnb-service/**'
              - 'common/**'

            housekeeping-service:
              - 'housekeeping-service/**'
              - 'common/**'

            maintenance-service:
              - 'maintenance-service/**'
              - 'common/**'

            inventory-service:
              - 'inventory-service/**'
              - 'common/**'

            finance-service:
              - 'finance-service/**'
              - 'common/**'

            messaging-service:
              - 'messaging-service/**'
              - 'common/**'

            platform-service:
              - 'platform-service/**'
              - 'common/**'

      - id: pick
        run: |
          if [ -n "${{ steps.all.outputs.services }}" ]; then
            echo 'services=${{ steps.all.outputs.services }}' >> "$GITHUB_OUTPUT"
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build ${{ matrix.service }}
        run: mvn -B -ntp -pl ${{ matrix.service }} -am package -DskipTests

      # Ships the jar straight to the VPS over SSH; nothing needs to live in Actions artifact storage.
      - name: SCP jar to the production server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_VPS_HOST }}" >> ~/.ssh/known_hosts
          # Fifteen build jobs reach the box at the same moment; sshd's MaxStartups drops some of those
          # connections, so every remote step retries with a pause before giving up.
          remote() { for i in 1 2 3 4 5 6 7 8; do "$@" && return 0; echo "attempt $i failed, retrying in $((i*10))s"; sleep $((i*10)); done; return 1; }
          # Spread the fifteen uploads over a minute so they do not all knock on sshd at once.
          sleep $((RANDOM % 60))
          jar=$(ls ${{ matrix.service }}/target/*.jar | head -1)
          dest="${{ secrets.PROD_VPS_USER }}@${{ secrets.PROD_VPS_HOST }}"
          dir="/opt/hospio-production/${{ matrix.service }}"
          remote ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$dest" "mkdir -p $dir"
          remote scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$jar" "$dest:$dir/app-new.jar.part"
          # The marker ties the staged jar to this commit, so a jar left behind by an earlier run is never deployed.
          remote ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$dest" \
            "mv $dir/app-new.jar.part $dir/app-new.jar && echo '${{ github.sha }}' > $dir/app-new.sha"
          rm -f ~/.ssh/deploy_key

  deploy:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    environment: production
    # Deploy whatever built, even if some matrix jobs failed; the script reports the ones that did not ship.
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.services != '[]' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          envs: CHANGED_SERVICES,DEPLOY_SHA
          command_timeout: 30m
          # Restart order follows the build order in the design handoff: identity → tenant → hotel config →
          # rooms → reservations → folio → payments → departments → back office → platform, gateway last.
          # Each service gets a health-checked restart with automatic rollback if it doesn't come back up.
          script: |
            set -e
            changed=$(echo "$CHANGED_SERVICES" | tr -d '[]" ' | tr ',' '\n')
            missing=""
            echo "Changed services: $(echo $changed | tr '\n' ' ')"

            declare -A health_urls
            health_urls["api-gateway"]="http://localhost:9200/actuator/health"
            health_urls["identity-service"]="http://localhost:9201/identity/actuator/health"
            health_urls["tenant-service"]="http://localhost:9202/tenant/actuator/health"
            health_urls["hotel-config-service"]="http://localhost:9203/hotel-config/actuator/health"
            health_urls["property-service"]="http://localhost:9204/property/actuator/health"
            health_urls["reservation-service"]="http://localhost:9205/reservation/actuator/health"
            health_urls["folio-service"]="http://localhost:9206/folio/actuator/health"
            health_urls["payment-service"]="http://localhost:9207/payment/actuator/health"
            health_urls["fnb-service"]="http://localhost:9208/fnb/actuator/health"
            health_urls["housekeeping-service"]="http://localhost:9209/housekeeping/actuator/health"
            health_urls["maintenance-service"]="http://localhost:9210/maintenance/actuator/health"
            health_urls["inventory-service"]="http://localhost:9211/inventory/actuator/health"
            health_urls["finance-service"]="http://localhost:9212/finance/actuator/health"
            health_urls["messaging-service"]="http://localhost:9213/messaging/actuator/health"
            health_urls["platform-service"]="http://localhost:9214/platform/actuator/health"

            ordered=(
              identity-service
              tenant-service
              hotel-config-service
              property-service
              reservation-service
              folio-service
              payment-service
              fnb-service
              housekeeping-service
              maintenance-service
              inventory-service
              finance-service
              messaging-service
              platform-service
              api-gateway
            )

            for svc in "${ordered[@]}"; do
              if ! echo "$changed" | grep -qx "$svc"; then
                echo "  — $svc unchanged, skipping"
                continue
              fi
              staged_sha=$(cat "/opt/hospio-production/$svc/app-new.sha" 2>/dev/null || echo none)
              if [ ! -f "/opt/hospio-production/$svc/app-new.jar" ] || [ "$staged_sha" != "$DEPLOY_SHA" ]; then
                if [ "$(cat "/opt/hospio-production/$svc/app.sha" 2>/dev/null)" = "$DEPLOY_SHA" ]; then
                  # A rerun of failed jobs: this service already shipped from this commit on an earlier attempt.
                  echo "  — $svc already running this commit, skipping"
                  rm -f "/opt/hospio-production/$svc/app-new.jar" "/opt/hospio-production/$svc/app-new.sha"
                  continue
                fi
                echo "  ✗ No JAR from this commit for $svc (staged: $staged_sha; its build job failed?) — leaving it as it is"
                rm -f "/opt/hospio-production/$svc/app-new.jar" "/opt/hospio-production/$svc/app-new.sha"
                missing="$missing $svc"
                continue
              fi
              rm -f "/opt/hospio-production/$svc/app-new.sha"
              echo "→ Deploying $svc"
              [ -f /opt/hospio-production/$svc/app.jar ] && cp /opt/hospio-production/$svc/app.jar /opt/hospio-production/$svc/app.jar.bak
              mv /opt/hospio-production/$svc/app-new.jar /opt/hospio-production/$svc/app.jar
              echo "$DEPLOY_SHA" > /opt/hospio-production/$svc/app.sha
              sudo systemctl enable -q hospio-$svc
              sudo systemctl restart hospio-$svc
              ok=false
              for i in $(seq 1 60); do
                status=$(wget -qO- "${health_urls[$svc]}" 2>/dev/null | grep -o '"status":"UP"' || echo "")
                if [ -n "$status" ]; then
                  echo "  ✓ $svc healthy"
                  ok=true
                  break
                fi
                sleep 5
              done
              if [ "$ok" = "false" ]; then
                echo "  ✗ $svc did not become healthy in 300s — rolling back"
                [ -f /opt/hospio-production/$svc/app.jar.bak ] && cp /opt/hospio-production/$svc/app.jar.bak /opt/hospio-production/$svc/app.jar
                sudo systemctl restart hospio-$svc
                exit 1
              fi
              rm -f /opt/hospio-production/$svc/app.jar.bak
            done
            if [ -n "$missing" ]; then
              echo "✗ Deployed everything that built, but these did not ship:$missing"
              exit 1
            fi
            echo "✓ Production deployment complete"
