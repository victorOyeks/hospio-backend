name: Deploy to Staging VPS

# One job, to keep Actions minutes down: every job pays its own runner start, checkout, JDK setup and Maven
# download, and bills rounded up to the minute. Earlier this was a detect job, one build job per service and a
# deploy job (up to 17 jobs per push, plus a random 0-60 s wait in each upload).
# Now: work out what changed, build those modules in one Maven reactor run, upload every jar over one SSH
# connection, and run scripts/vps/deploy-staged.sh on the box (health-checked restarts with rollback).

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy: 'all' or a comma-separated list (e.g. identity-service,api-gateway)"
        required: false
        default: all

# One deploy at a time on the box; a new run waits for the running one instead of racing it.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A manual run, the very first push to the branch, a push whose "before" commit is gone (force push), a
      # change to the root pom.xml, or a commit message with [deploy-all] deploys everything. A change under
      # common/ deploys every service that uses it (all but the gateway).
      - name: Work out what changed
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.services }}
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          services="identity-service tenant-service hotel-config-service property-service reservation-service folio-service payment-service fnb-service housekeeping-service maintenance-service inventory-service finance-service messaging-service platform-service"
          all="api-gateway $services"
          pick=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then pick="$all"; else pick=$(echo "$REQUESTED" | tr ',' ' '); fi
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               || printf '%s' "$MESSAGE" | grep -q '\[deploy-all\]'; then
            pick="$all"
          else
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if echo "$files" | grep -qx 'pom.xml'; then
              pick="$all"
            else
              echo "$files" | grep -q '^common/' && pick="$services"
              for s in $all; do
                echo "$files" | grep -q "^$s/" && pick="$pick $s"
              done
            fi
          fi
          pick=$(echo $pick | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' | sed 's/ $//')
          echo "Deploying: ${pick:-nothing}"
          echo "services=$pick" >> "$GITHUB_OUTPUT"
          echo "modules=$(echo $pick | tr ' ' ',')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.pick.outputs.services != ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        if: steps.pick.outputs.services != ''
        run: mvn -B -ntp -T 1C -pl "${{ steps.pick.outputs.modules }}" -am package -DskipTests

      - name: Ship jars and deploy
        if: steps.pick.outputs.services != ''
        env:
          SERVICES: ${{ steps.pick.outputs.services }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh stage
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_() { ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$VPS_USER@$VPS_HOST" "$@"; }
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "attempt $i failed, retrying in $((i*10))s"; sleep $((i*10)); done; return 1; }

          # Stage <svc>/app-new.jar and app-new.sha (the marker ties the jar to this commit), then send them all
          # in one tar stream: one SSH connection instead of three per service.
          for s in $SERVICES; do
            mkdir -p "stage/$s"
            cp "$(ls $s/target/*.jar | grep -v '\.original$' | head -1)" "stage/$s/app-new.jar"
            echo "$GITHUB_SHA" > "stage/$s/app-new.sha"
          done
          retry sh -c 'tar -C stage -cf - . | ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "$0" "tar -C /opt/hospio-staging -xf -"' "$VPS_USER@$VPS_HOST"

          changed=$(echo $SERVICES | tr ' ' ',')
          ssh_ "CHANGED_SERVICES='$changed' DEPLOY_SHA='$GITHUB_SHA' bash -s" < scripts/vps/deploy-staged.sh
          rm -f ~/.ssh/deploy_key
