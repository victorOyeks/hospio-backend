server:
  port: 9214
  forward-headers-strategy: framework
  # Fewer threads than Tomcat's 200: more would only queue on the connection pool.
  tomcat:
    threads:
      max: 50
    accept-count: 50
  servlet:
    context-path: /platform

spring:
  task:
    scheduling:
      # One slow job no longer holds up the others (each job still runs on one instance at a time).
      pool:
        size: 3
  config:
    import: optional:file:.env[.properties]
  application:
    name: platform-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospio}?currentSchema=platform
    username: ${DB_USERNAME:hospio}
    password: ${DB_PASSWORD:hospio}
    hikari:
      # Liquibase writes its changelog table into this schema before the first changeset runs, so the
      # schema has to exist before Liquibase gets a connection. Idempotent, runs once per pooled connection.
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS platform
      # Budget: every service's pool together stays under ~80 of Postgres' 100 connections (another product uses ~10).
      maximum-pool-size: 6
      minimum-idle: 2
      # Fail a request after 3s waiting for a connection instead of 30s; log a connection held over 20s.
      connection-timeout: 3000
      leak-detection-threshold: 20000
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: platform
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: platform
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: hospio-platform-service
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:2}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment-change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

hospio:
  # Paystack (device invoices paid online); the key saved in Settings · Integrations wins.
  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:}
  # Master key for secrets stored in the database (integration settings, hotels' POS keys): 32 bytes, base64. SECRETS_KEY, else the
  # older name POS_SECRETS_KEY (same key: values sealed with it still open).
  secrets-key: ${SECRETS_KEY:${POS_SECRETS_KEY:}}
  deliveries:
    echo: ${DELIVERIES_ECHO:false}
  logging:
    # Log request bodies and error responses (secrets masked). On for dev/staging via HOSPIO_LOG_BODIES.
    bodies: ${HOSPIO_LOG_BODIES:false}
  seed:
    # Creates the admin portal's staging data (settings defaults, Royal Suites statements and tickets, the marketer) when missing (env SEED_DEMO_DATA).
    enabled: ${SEED_DEMO_DATA:false}
  # Our own servers other than this machine whose X-Client-Address is believed (the landing site passing on a visitor's address
  # for the public forms' hourly limit); comma separated. This machine's own addresses are always believed.
  site-addresses: ${SITE_ADDRESSES:}
  partner-applications:
    per-address-per-hour: ${PARTNER_APPLICATIONS_PER_ADDRESS:3}
    per-email-per-hour: ${PARTNER_APPLICATIONS_PER_EMAIL:3}
  apps:
    # Where the marketer invite link points.
    admin-url: ${ADMIN_APP_URL:https://admin-staging.hospio360.com}
    # Where report emails link to (the hotel app).
    hotel-url: ${HOTEL_APP_URL:https://web-staging.hospio360.com}
  worker:
    # The nightly job (01:30 Lagos): overdue statements, health scores, alert sweep.
    enabled: ${WORKER_ENABLED:true}
  qa:
    # QA only, never in production: one hotel's day worked out, and the monthly invoice issued / its daily steps run for a chosen date
    # (QaFeeController, QaBillingController, docs/plan-monthly-invoices.md). On for staging with QA_FEE_SIMULATION=true.
    fee-simulation: ${QA_FEE_SIMULATION:false}
    # QA only, never in production: POST /admin/qa/retention/run (QaRetentionController) runs the 03:30 audit log retention now.
    tools: ${QA_TOOLS:${QA_FEE_SIMULATION:false}}
  retention:
    # Audit logs (activity log, Changes by Hospio360) are kept this many days when the admin setting Security → audit retention days
    # isn't set (docs/data-retention.md). Never less than 7.
    audit-days: ${AUDIT_RETENTION_DAYS:7}
  billing:
    # Monthly invoice (docs/plan-monthly-invoices.md). On staging BILLING_QA_ONLY=true: only QA businesses (name starting "QA", an owner at
    # @hospio-qa.test, or an id in BILLING_QA_BUSINESS_IDS) are invoiced, reminded or restricted; real-looking businesses never are.
    qa-only: ${BILLING_QA_ONLY:false}
    qa-business-ids: ${BILLING_QA_BUSINESS_IDS:}
  # Platform → System health (docs/system-health.md). The units, ports and folders looked at are fixed here, never by a request.
  system-health:
    enabled: ${SYSTEM_HEALTH_ENABLED:true}
    # Units are <unit-prefix><service>-service and <unit-prefix>api-gateway (systemd, staging: hospio-identity-service ...).
    unit-prefix: ${SYSTEM_HEALTH_UNIT_PREFIX:hospio-}
    gateway-url: ${SYSTEM_HEALTH_GATEWAY_URL:http://localhost:9200}
    # Where CI leaves each service's app.sha (the deployed commit) and each web app's current/.sha.
    deploy-dir: ${SYSTEM_HEALTH_DEPLOY_DIR:/opt/hospio-staging}
    apps-dir: ${SYSTEM_HEALTH_APPS_DIR:/home/devoyeks/apps}
    # Web apps: unit=port=Name, comma separated (their page must answer on 127.0.0.1:port).
    frontends: ${SYSTEM_HEALTH_FRONTENDS:his-fe-staging=3001=Hotel app (web-staging),hospio-admin-staging=3002=Admin portal (admin-staging),hospio-landing-staging=3003=Landing site (hospio360.com)}
    # Public hostnames whose TLS certificate expiry is checked.
    cert-hosts: ${SYSTEM_HEALTH_CERT_HOSTS:hospio360.com,www.hospio360.com,web-staging.hospio360.com,admin-staging.hospio360.com,api-staging.hospio360.com}
    # Folders whose size is shown: Label=/path, comma separated (measured in the background every 15 minutes).
    dirs: ${SYSTEM_HEALTH_DIRS:All logs=/var/log,System journal=/var/log/journal,Hospio services and uploads=/opt/hospio-staging,Hospio web apps=/home/devoyeks/apps,Earlier backups=/home/devoyeks/backups}
    # How the database is backed up, in words; empty = "No scheduled backup" on the page.
    backups: ${SYSTEM_HEALTH_BACKUPS:}
  legal:
    # A material new version of a legal document needs this many days' notice (docs/legal-acceptance.md).
    material-notice-days: ${LEGAL_MATERIAL_NOTICE_DAYS:30}
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_DIR:./storage}
  pos:
    provider: ${POS_PROVIDER:logging}
  channels:
    provider: ${CHANNELS_PROVIDER:logging}
  approvals:
    manager-spend-limit: ${MANAGER_SPEND_LIMIT:500000}
    manager-discount-limit: ${MANAGER_DISCOUNT_LIMIT:50000}
    org-credit-owner-limit: ${ORG_CREDIT_OWNER_LIMIT:1000000}

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9201/identity}
  tenant:
    url: ${TENANT_SERVICE_URL:http://localhost:9202/tenant}
  hotelconfig:
    url: ${HOTEL_CONFIG_SERVICE_URL:http://localhost:9203/hotel-config}
  property:
    url: ${PROPERTY_SERVICE_URL:http://localhost:9204/property}
  reservation:
    url: ${RESERVATION_SERVICE_URL:http://localhost:9205/reservation}
  folio:
    url: ${FOLIO_SERVICE_URL:http://localhost:9206/folio}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:9207/payment}
  fnb:
    url: ${FNB_SERVICE_URL:http://localhost:9208/fnb}
  housekeeping:
    url: ${HOUSEKEEPING_SERVICE_URL:http://localhost:9209/housekeeping}
  maintenance:
    url: ${MAINTENANCE_SERVICE_URL:http://localhost:9210/maintenance}
  inventory:
    url: ${INVENTORY_SERVICE_URL:http://localhost:9211/inventory}
  finance:
    url: ${FINANCE_SERVICE_URL:http://localhost:9212/finance}
  messaging:
    url: ${MESSAGING_SERVICE_URL:http://localhost:9213/messaging}
  platform:
    url: ${PLATFORM_SERVICE_URL:http://localhost:9214/platform}
  internal:
    api-key: ${INTERNAL_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
